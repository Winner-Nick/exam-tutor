# 自动构建安卓 APK（Capacitor 套壳，WebView 直连你的服务器）。
# 服务器地址不写进仓库：在 Settings -> Secrets and variables -> Actions -> Variables
# 配置 APP_SERVER_URL（如 https://your.domain）。构建产物在 run 页面的 Artifacts 下载。
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 打 tag 时创建 Release 需要
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build web assets
        working-directory: frontend
        run: |
          # npm 偶发 "Exit handler never called" 后留下半截 node_modules 且退出码为 0：
          # 用 npm ls 做严格完整性校验，不完整就清掉重装
          ok=""
          for i in 1 2 3; do
            rm -rf node_modules
            npm ci --no-audit --no-fund || true
            if npm ls react-router-dom @tanstack/react-query react typescript vite > /dev/null 2>&1; then
              ok=1; break
            fi
            echo "依赖安装不完整，第 $i 次重试…"; sleep 10
          done
          test -n "$ok"
          npm run build

      - name: Scaffold Capacitor Android shell
        working-directory: frontend
        env:
          APP_SERVER_URL: ${{ vars.APP_SERVER_URL }}
        run: |
          if [ -z "$APP_SERVER_URL" ]; then
            echo "::error::请在仓库 Settings -> Actions Variables 配置 APP_SERVER_URL"
            exit 1
          fi
          npm i --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<EOF
          {
            "appId": "work.examtutor.app",
            "appName": "错题家教",
            "webDir": "dist",
            "server": { "url": "$APP_SERVER_URL" }
          }
          EOF
          npx cap add android
          # 拍照上传需要相机权限
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />#' \
            android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename artifact
        run: cp frontend/android/app/build/outputs/apk/debug/app-debug.apk 错题家教.apk

      - uses: actions/upload-artifact@v4
        with:
          name: examtutor-apk
          path: 错题家教.apk
          retention-days: 30

      # 推送 v* 标签时自动发布 Release：版本说明取自标签注释
      # （git tag -a v1.2.0 -m "说明…" && git push origin v1.2.0）
      - name: Extract tag notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --depth=1 origin "+${GITHUB_REF}:${GITHUB_REF}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md
          cat release-notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 错题家教 ${{ github.ref_name }}
          body_path: release-notes.md
          files: 错题家教.apk

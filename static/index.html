<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>错题精讲 · ExamTutor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="/static/css/styles.css?v=2" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>" />
</head>
<body>
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-logo">📘</span>
      <div class="brand-text">
        <strong>错题精讲</strong>
        <small>ExamTutor</small>
      </div>
    </div>
    <div class="topbar-right">
      <span class="model-badges">
        <span class="badge badge-vision">👁 Gemini Flash 识别</span>
        <span class="badge badge-text">🧠 DeepSeek 讲解</span>
      </span>
      <button id="btn-new" class="btn btn-ghost hidden">＋ 新试卷</button>
    </div>
  </header>

  <main id="app">
    <!-- 上传视图 -->
    <section id="view-upload" class="view view-center">
      <div class="upload-hero">
        <h1>上传试卷，自动找出错题并讲解</h1>
        <p class="sub">把含有<strong>作答</strong>与<strong>答案</strong>的试卷 PDF 拖进来，
          系统会自动识别每道题、对照答案判分，并对错题逐一讲解。你也能随时就任意一题或知识点提问。</p>
        <label id="dropzone" class="dropzone">
          <input id="file-input" type="file" accept="application/pdf" hidden />
          <div class="dz-icon">📄⬆️</div>
          <div class="dz-title">拖入 PDF 或点击选择</div>
          <div class="dz-hint">支持扫描件 / 拍照件，单个 PDF</div>
        </label>
        <div class="upload-steps">
          <span>① 识别题目与作答</span><i>→</i>
          <span>② 对照答案判分</span><i>→</i>
          <span>③ 逐题讲解</span><i>→</i>
          <span>④ 自由提问</span>
        </div>
      </div>
    </section>

    <!-- 处理中视图 -->
    <section id="view-processing" class="view view-center hidden">
      <div class="proc-card">
        <div class="spinner"></div>
        <h2 id="proc-label">正在准备…</h2>
        <div class="stepper" id="stepper">
          <div class="step" data-stage="render"><span class="dot"></span>渲染页面</div>
          <div class="step" data-stage="vision"><span class="dot"></span>识别内容</div>
          <div class="step" data-stage="consolidate"><span class="dot"></span>对照判分</div>
          <div class="step" data-stage="explain"><span class="dot"></span>讲解错题</div>
        </div>
        <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
        <div id="proc-file" class="proc-file"></div>
      </div>
    </section>

    <!-- 结果视图 -->
    <section id="view-results" class="view hidden">
      <!-- 概览条 -->
      <div class="result-head">
        <div class="rh-title">
          <h2 id="exam-title">试卷</h2>
          <div id="exam-meta" class="exam-meta"></div>
        </div>
        <div class="rh-stats" id="stats-row"></div>
        <button id="btn-paper" class="btn btn-ghost">📖 查看原卷</button>
      </div>

      <div class="result-body">
        <!-- 题目导航 -->
        <aside class="nav-pane">
          <div class="filter-tabs" id="filter-tabs">
            <button data-f="all" class="active">全部</button>
            <button data-f="wrong">错题</button>
            <button data-f="unknown">待确认</button>
            <button data-f="correct">已对</button>
            <button data-f="subjective">主观</button>
          </div>
          <div class="q-grid" id="q-grid"></div>
          <div class="nav-legend">
            <span><i class="lg correct"></i>对</span>
            <span><i class="lg wrong"></i>错</span>
            <span><i class="lg unknown"></i>待确认</span>
            <span><i class="lg subjective"></i>主观</span>
          </div>
        </aside>

        <!-- 题目详情 -->
        <section class="detail-pane" id="detail-pane">
          <div class="empty-detail">从左侧选择一道题查看详情与讲解</div>
        </section>

        <!-- 答疑 -->
        <aside class="chat-pane" id="chat-pane">
          <div class="chat-head">
            <div>
              <strong>AI 家教</strong>
              <div id="chat-context" class="chat-context">整卷答疑</div>
            </div>
            <button id="chat-clear" class="btn btn-mini" title="切换为整卷答疑">整卷</button>
          </div>
          <div class="chat-msgs" id="chat-msgs"></div>
          <div class="chat-quick" id="chat-quick"></div>
          <form class="chat-input" id="chat-form">
            <textarea id="chat-text" rows="1" placeholder="问问这道题或任意知识点…（Enter 发送）"></textarea>
            <button type="submit" id="chat-send" class="btn btn-primary">发送</button>
          </form>
        </aside>
      </div>
    </section>
  </main>

  <!-- 原卷查看 -->
  <div id="paper-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-box">
      <div class="modal-head"><strong>📖 原卷</strong><button id="paper-close" class="btn btn-mini">关闭</button></div>
      <div id="paper-pages" class="paper-pages"></div>
    </div>
  </div>

  <!-- 提示条 -->
  <div id="toast" class="toast hidden"></div>

  <script src="/static/js/app.js?v=2"></script>
</body>
</html>
